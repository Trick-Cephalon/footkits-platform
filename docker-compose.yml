version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: footkits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: footkits
      POSTGRES_PASSWORD: footkits_dev
      POSTGRES_DB: footkits
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U footkits']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: footkits-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', 'redis_dev', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footkits-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://footkits:footkits_dev@postgres:5432/footkits
      REDIS_URL: redis://:redis_dev@redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Adminer — lightweight DB GUI (dev only)
  adminer:
    image: adminer:4
    container_name: footkits-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
  redis_data:
